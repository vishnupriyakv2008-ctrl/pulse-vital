const NAMES=[['Patient portal',[['s1','Welcome and portal choice'],['s2','Aadhaar and OTP sign-in'],['s3','My health vault'],['s4','My ID and QR'],['s5','Reports'],['s6','Access log']]],['Doctor portal',[['s7','Doctor sign-in'],['s8','Find a patient'],['s9','Emergency summary'],['s10','Add and verify a record']]]];
function dock(){$('.dock').innerHTML=`<h1>Pulse &amp; Vital</h1><p>Interactive prototype. All data is sample data.</p>${NAMES.map(g=>`<h3>${g[0]}</h3>${g[1].map(([r,l])=>`<button class="dk ${S.r===r?'on':''}" data-a="go" data-r="${r}"><b>${r.slice(1)}</b>${l}</button>`).join('')}`).join('')}<button class="rs" data-a="reset">Reset demo data</button>`}
function R(){const pt=+S.r.slice(1)<7,b=SC[S.r]();
$('#stage').className=pt?'p':'d';
$('#stage').innerHTML=pt?`<div class="ph ${S.r==='s1'?'h':''}"><div class="sbr"><b>9:41</b><span>•••</span></div>${b}</div>`:`<div class="br"><div class="bb"><i></i><i></i><i></i><span>pulsevital.health/${U[S.r]}</span></div>${b}</div>`;
dock();if(S.r==='s2')u2();if(S.r==='s4')tick();document.documentElement.lang=S.lang}
function u2(){if(S.r!=='s2')return;const av=(S.aad||'').length==12,pk=/^\d{10}$/.test(S.ph||'');
$('#aadok').style.opacity=av?1:0;
$('#steps').innerHTML=`<span class="st ${av?'g':'b'}">${av?ic('check',12):''}Aadhaar</span><u></u><span class="st ${av?'b':''}">Phone OTP</span><u></u><span class="st">Done</span>`;
const sb=$('#sendb');sb.textContent=S.otp?'OTP sent':'Send OTP';sb.disabled=!!S.otp;
const rb=$('#rsb');rb.textContent=S.otp?(S.cd>0?'Resend in 0:'+pad(S.cd):'Resend OTP'):'';rb.disabled=!S.otp||S.cd>0}
function tick(){if(S.r!=='s4')return;const w=win(),rem=60-Math.floor(Date.now()/1000)%60;
if(S.w!==w){S.w=w;$('#qrb').innerHTML=qr(w);$('#tkn').textContent=tk(w)}
$('#cdt').textContent='New code in '+(rem==60?'1:00':'0:'+pad(rem));$('#cdb').style.width=rem/60*100+'%'}
setInterval(()=>{if(S.cd>0){S.cd--;u2()}tick()},1000);
function go(r){if(r==='s2'&&S.pin)r='s3';
if(r==='s2'&&!S.pin&&S.r!=='s2'){S.otp=null;S.aad='';S.ph='';S.cd=0}
if(['s3','s4','s5','s6'].includes(r)&&!S.pin){toast('Sign in to your vault first');r='s2'}
if(['s8','s9','s10'].includes(r)&&!S.din){toast('Sign in as a doctor first');r='s7'}
if(r==='s7'&&S.din)r='s8';
if(r==='s9'&&!S.op){toast('Find a patient first');r='s8'}
if(r==='s5')S.ox=0;S.r=r;R();scrollTo({top:0})}
function openP(id,how){id=(id||'').trim().toUpperCase();if(how==='em'&&!id)id=P.id;
if(id!==P.id)return err('#err8','No vault found for that ID. Check the number printed on the card.');
const k=how==='em'?'Emergency summary':how==='qr'?'QR scan':'Records opened';
D.log.unshift({h:S.doc.h,dr:S.doc.n,w:how==='em'?'Emergency summary viewed':how==='qr'?'Records opened by QR scan':'Records opened',at:tm()});
D.look.unshift({id,k,at:tm()});save();S.op=true;S.ot=tm().replace('Today, ','');S.st='scan';S.el='en';go('s9')}
const act={
go:a=>go(a.dataset.r),lang:a=>{S.lang=a.dataset.v;R()},
pn:a=>{const v=a.dataset.v;if(v==='s6l'){S.lt='log';go('s6')}else if(v==='s6m'){S.lt='me';go('s6')}else go(v)},
grp:a=>{S.tab=a.dataset.v;go('s5')},tab:a=>{S.tab=a.dataset.v;S.ox=0;R()},ox:a=>{S.ox=+a.dataset.v;R()},
full:a=>{const r=reps()[+a.dataset.v];modal(`<h2>${r.ti}</h2><div class="pv">${pv(220)}<span>Sample slice, axial (full size)</span></div><div class="row"><span class="vb">${ic('shield',12)}Signed by ${r.by}</span><button class="cta" style="width:auto" data-a="close">Close</button></div>`)},
lt:a=>{S.lt=a.dataset.v;R()},
editec:()=>modal(`<h2>Emergency contact</h2><p class="mut">Staff at verified hospitals can see this number if you cannot speak.</p><label for="ecn">Name and relation</label><input id="ecn" value="${D.ec.n}"><label for="ecp">Phone number</label><input id="ecp" inputmode="tel" value="${D.ec.p}"><p class="err" id="erre" role="alert"></p><div class="row"><button class="cta o" data-a="close">Cancel</button><button class="cta" data-a="saveec">Save contact</button></div>`),
saveec:()=>{const n=$('#ecn').value.trim(),p=$('#ecp').value.trim();if(!n)return err('#erre','Enter a name.');if(p.replace(/\D/g,'').length<10)return err('#erre','Enter a phone number with at least 10 digits.');D.ec={n,p};save();close();R();toast('Emergency contact saved')},
psign:()=>{S.pin=false;S.otp=null;go('s1')},
print:()=>window.print(),wallet:()=>{S.wal=true;R();toast('Added to wallet (demo)')},
sendotp:()=>{if((S.aad||'').length!=12)return err('#err','Enter a valid 12-digit Aadhaar number first.');if(!/^\d{10}$/.test(S.ph||''))return err('#err','Enter a valid 10-digit mobile number.');
err('#err','');S.otp=String(100000+Math.floor(Math.random()*900000));S.cd=30;u2();document.querySelectorAll('.ob').forEach((x,i)=>x.value=S.otp[i]);toast('Demo OTP: '+S.otp+' (a real app would send an SMS)',9000)},
verify:()=>{const v=[...document.querySelectorAll('.ob')].map(x=>x.value).join('');
if((S.aad||'').length!=12)return err('#err','Enter a valid 12-digit Aadhaar number.');
if(!/^\d{10}$/.test(S.ph||''))return err('#err','Enter a valid 10-digit mobile number.');
if(!S.otp)return err('#err','Tap Send OTP to get your code.');
if(v!==S.otp)return err('#err','That code does not match. Check the 6 digits.');
if(!$('#cons').checked)return err('#err','Please agree to the consent statement to continue.');
S.pin=true;toast('Vault opened');go('s3')},
eye:()=>{const p=$('#pw');p.type=p.type==='password'?'text':'password'},
reqv:()=>modal(`<h2>Request verification</h2><p class="mut">New hospitals apply before they get access.</p><label for="rn">Hospital name</label><input id="rn"><label for="rg">Registration number</label><input id="rg"><label for="re">Official email</label><input id="re" type="email"><p class="err" id="errr" role="alert"></p><div class="row"><button class="cta o" data-a="close">Cancel</button><button class="cta te" data-a="sendreq">Send request</button></div>`),
sendreq:()=>{if(!$('#rn').value.trim()||!$('#rg').value.trim()||!/^\S+@\S+\.\S+$/.test($('#re').value))return err('#errr','Fill in all three fields with a valid email.');close();toast('Request sent. Your hospital ID arrives by email after review.',4000)},
dsign:()=>{const h=$('#hid').value.trim().toUpperCase(),em=$('#em').value.trim(),pw=$('#pw').value;
if(!H[h])return err('#err7','That hospital ID is not on the verified list. Use Request verification to apply.');
if(!/^\S+@\S+\.\S+$/.test(em))return err('#err7','Enter the email your hospital gave you.');
if(pw.length<6)return err('#err7','Password must be at least 6 characters.');
S.din=true;S.doc={n:dn(em),h:H[h],id:h};go('s8')},
dn:a=>{const v=a.dataset.v;if(v==='s8'||v==='s10')go(v);else if(v==='rl'){go('s8');setTimeout(()=>$('#recent').scrollIntoView({behavior:'smooth'}),30)}else modal(`<h2>Hospital settings</h2><div class="kv"><span>Hospital</span>${S.doc.h}</div><div class="kv"><span>Hospital ID</span>${S.doc.id}</div><div class="kv"><span>Signed in as</span>${S.doc.n}</div><div class="kv"><span>Lookups saved</span>${D.look.length}</div><div class="row"><button class="cta o" data-a="close">Close</button><button class="cta te" data-a="dout">Sign out</button></div>`)},
dout:()=>{S.din=false;S.op=false;close();go('s1')},
open:a=>openP($('#fid').value,a.dataset.v),
pick:a=>{S.fid=a.dataset.v;R()},
scanq:()=>modal(`<h2>Scan the patient's QR</h2><div class="scanb"><i></i>${ic('scan',44)}</div><p class="mut" style="margin-top:8px">Demo: this prototype has no camera. Type the live code shown under the patient's QR, or use the code from this device.</p><label for="qc">Live code</label><input id="qc" autocomplete="off" placeholder="PV…"><p class="err" id="errq" role="alert"></p><div class="row"><button class="cta o" data-a="selfq">Use code from this device</button><button class="cta te" data-a="chkq">Open records</button></div>`),
selfq:()=>{$('#qc').value=tk(win())},
chkq:()=>{const c=$('#qc').value.trim().toUpperCase(),w=win();if(c!==tk(w)&&c!==tk(w-1))return err('#errq','Code expired or not recognised. Ask the patient to show the new code.');close();openP(P.id,'qr')},
el:a=>{S.el=a.dataset.v;R()},st:a=>{S.st=a.dataset.v;R()},call:()=>toast('Calling '+D.ec.n+'… (demo, no real call placed)'),
rt:a=>{S.ar.i=+a.dataset.v;R()},
sample:()=>{S.ar.f={n:'CT_brain_'+iso()+'.dcm',mb:'214'};S.ar.p=0;upl();R()},
sign:()=>{const a=S.ar,t=AT[a.i];if(!(a.f&&a.p>=100)&&!a.note.trim())return err('#err10',"Upload a file or add a doctor's note before signing.");
if(a.f&&a.p<100)return err('#err10','Wait for the upload to finish.');
D.rec.unshift({t:t[1],ti:a.title.trim()||t[0],d:iso(),by:S.doc.n,h:S.doc.h,pv:a.f&&t[1]==='scan'?1:0,em:0});
D.log.unshift({h:S.doc.h,dr:S.doc.n,w:'Added and signed a '+t[0],at:tm()});save();S.ar={i:0,title:'',note:'',f:null,p:0};R();
modal(`<h2>Record signed and added</h2><p class="mut">It now shows in the patient's vault as verified, signed by ${S.doc.n}.</p><div class="row"><button class="cta o" data-a="go2" data-r="s8">Find a patient</button><button class="cta te" data-a="go2" data-r="s9">View summary</button></div>`)},
go2:a=>{close();go(a.dataset.r)},close,shade:(a,e)=>{if(e.target===a)close()},
reset:()=>{D=seed();save();Object.assign(S,{pin:false,din:false,op:false,otp:null,wal:false});close();go('s1');toast('Demo data reset')}};
let ut;function upl(){clearInterval(ut);ut=setInterval(()=>{const a=S.ar;if(!a.f||a.p>=100)return clearInterval(ut);a.p=Math.min(100,a.p+10);const b=$('#upb');if(b){b.style.width=a.p+'%';$('#upt').textContent=a.p<100?'Uploading… '+a.p+'%':a.f.mb+' MB, uploaded'}},150)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&act[a.dataset.a])act[a.dataset.a](a,e)});
document.addEventListener('input',e=>{const t=e.target;
if(t.id==='aad'){S.aad=t.value.replace(/\D/g,'').slice(0,12);t.value=fa(S.aad);u2()}
else if(t.id==='ph'){let d=t.value.replace(/\D/g,'');if(d.length>10&&d.startsWith('91'))d=d.slice(2);if(d.length>10&&d.startsWith('0'))d=d.slice(1);S.ph=d.slice(0,10);t.value=S.ph;u2()}
else if(t.classList.contains('ob')){t.value=t.value.replace(/\D/g,'');if(t.value&&t.nextElementSibling)t.nextElementSibling.focus()}
else if(t.id==='hid'){$('#hok').style.display=H[t.value.trim().toUpperCase()]?'':'none'}
else if(t.id==='ti')S.ar.title=t.value;else if(t.id==='nt')S.ar.note=t.value;else if(t.id==='fid')S.fid=t.value});
document.addEventListener('change',e=>{if(e.target.id==='fl'&&e.target.files[0]){const f=e.target.files[0];S.ar.f={n:f.name,mb:(f.size/1048576).toFixed(1)};S.ar.p=0;upl();R()}});
document.addEventListener('focusin',e=>{if(e.target.id==='aad')e.target.value=fa(S.aad||'')});
document.addEventListener('focusout',e=>{if(e.target.id==='aad'&&(S.aad||'').length==12)e.target.value='XXXX XXXX '+S.aad.slice(-4)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();
if(e.key==='Backspace'&&e.target.classList.contains('ob')&&!e.target.value&&e.target.previousElementSibling)e.target.previousElementSibling.focus();
if(e.key==='Enter'){if(e.target.closest('#dform'))act.dsign();else if(e.target.id==='fid')act.open({dataset:{v:'id'}});else if(e.target.closest('[data-a=ox]'))e.target.click()}});
document.addEventListener('paste',e=>{if(e.target.classList.contains('ob')){const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(d.length>1){e.preventDefault();document.querySelectorAll('.ob').forEach((x,i)=>x.value=d[i]||'')}}});
R();
</script></body></html>
